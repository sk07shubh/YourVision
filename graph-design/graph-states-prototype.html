<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YourVision graph states prototype</title>
<style>
:root{--yv-bg:#1a1a1a;--yv-text:#efefef;--yv-muted:#a8a8a8;--yv-border:#3e3e3e;--yv-elevated:#282828}
*{box-sizing:border-box}
body{margin:0;background:#141414;color:var(--yv-text);font:14px/1.5 ui-sans-serif,system-ui,sans-serif}
header{padding:28px 32px 8px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
h1{margin:0;font:700 24px/1.2 ui-sans-serif,system-ui,sans-serif}
header p{margin:4px 0 0;color:var(--yv-muted);max-width:700px}
button{background:#FFA116;color:#1a1a1a;border:0;border-radius:8px;padding:8px 14px;font:700 13px ui-monospace,Menlo,monospace;cursor:pointer}
button.ghost{background:transparent;color:#FFA116;border:1px solid #FFA116;padding:4px 10px;font-size:11px}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px;padding:16px 32px 48px}
.cell{background:#282828;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.cell h2{margin:0;font:700 12px ui-monospace,Menlo,monospace;letter-spacing:.08em;color:#a8a8a8;display:flex;justify-content:space-between;align-items:center}
.cell p{margin:0;color:#d8d8d8;font:12px/1.5 ui-monospace,Menlo,monospace}
.stage{display:flex;justify-content:center;padding:34px 0 30px}
.yv-graph-canvas{width:300px;height:170px;min-width:0;margin:0}
</style>
<style>
/* ==========================================================================
   YourVision graph renderer. APPEND to the end of styles.css (after the tree
   block). Keep your existing shared keyframes (yv-graph-node-entered, etc.):
   trie, DSU and tree views still use them. These rules override the old
   .yv-graph-node-* and .yv-graph-edge-* animations by specificity.
   ========================================================================== */
.yv-graph {
  --g-orange: #FFA116; --g-green: #2CBB5D; --g-red: #FF375F; --g-blue: #4DA3FF;
  --g-amber: #FFC01E; --g-edge: color-mix(in srgb, var(--yv-muted, #a8a8a8), transparent 25%);
  --g-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
.yv-graph-scroll { overflow-x: auto; max-width: 100%; padding: 8px 0 28px; }
.yv-graph-canvas {
  position: relative; width: 600px; height: 320px; min-width: 600px; margin: 0 auto;
  border-radius: 14px; background-color: color-mix(in srgb, var(--yv-elevated, #282828) 60%, var(--yv-bg, #1a1a1a));
  background-image: radial-gradient(circle, color-mix(in srgb, var(--yv-text, #efefef), transparent 90%) 1px, transparent 1.4px);
  background-size: 20px 20px;
}
.yv-graph-links { position: absolute; inset: 0; overflow: visible; pointer-events: none; }

/* ---------- edges ---------- */
.yv-graph-edge { stroke: var(--g-edge); stroke-width: 1.8; stroke-linecap: round; transition: opacity 180ms ease, stroke-width 180ms ease, stroke 180ms ease; }
.yv-graph-arrow path { fill: var(--g-edge); }
.yv-graph-arrow-added path { fill: var(--g-green); }
.yv-graph-arrow-removed path { fill: var(--g-red); }
.yv-graph-arrow-traversed path, .yv-graph-arrow-trail path { fill: var(--g-blue); }
.yv-graph-edge.yv-graph-edge-trail { stroke: var(--g-blue); stroke-width: 2.6; animation: none; }
.yv-graph-edge.yv-graph-edge-added { stroke: var(--g-green); stroke-width: 2.6; stroke-dasharray: 1; stroke-dashoffset: 1; animation: yv-g-edge-draw 520ms ease-out forwards; }
.yv-graph-edge.yv-graph-edge-traversed { stroke: var(--g-blue); stroke-width: 3.4; filter: drop-shadow(0 0 4px var(--g-blue)); animation: yv-g-edge-travel 700ms ease-out both; }
.yv-graph-edge.yv-graph-edge-removed { stroke: var(--g-red); stroke-width: 2; stroke-dasharray: .035 .03; animation: yv-g-edge-fade 900ms ease-out both; }
.yv-graph.is-hovering .yv-graph-edge:not(.is-incident) { opacity: .14; }
.yv-graph-edge.is-incident { stroke: var(--g-orange); stroke-width: 3; opacity: 1; }
.yv-graph-edge-badge {
  position: absolute; z-index: 3; transform: translate(-50%, -50%); padding: 1px 7px; border-radius: 999px;
  font: 800 9px/1.4 var(--g-mono); letter-spacing: .07em; color: #1a1a1a; pointer-events: none;
}
.yv-graph-edge-badge.is-added { background: var(--g-green); }
.yv-graph-edge-badge.is-removed { background: var(--g-red); }
.yv-graph-edge-badge.is-traversed { background: var(--g-blue); }

/* ---------- vertices ---------- */
.yv-graph-node {
  position: absolute; z-index: 2; width: 54px; height: 54px; box-sizing: border-box; display: flex;
  align-items: center; justify-content: center; border: 2px solid var(--g-orange); border-radius: 50%;
  background: color-mix(in srgb, var(--g-orange) 10%, var(--yv-bg, #1a1a1a)); color: var(--yv-text, #efefef);
  box-shadow: 0 2px 0 color-mix(in srgb, var(--g-orange), transparent 68%); text-align: center; cursor: default;
  transition: opacity 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
}
.yv-graph-node:focus-visible { outline: 2px solid var(--g-blue); outline-offset: 3px; }
.yv-graph.is-hovering .yv-graph-node:not(.is-hovered):not(.is-neighbor) { opacity: .35; }
.yv-graph-node.is-hovered { box-shadow: 0 0 0 4px color-mix(in srgb, var(--g-orange), transparent 70%); }
.yv-graph-node-value { font: 700 15px/1.1 var(--g-mono); overflow-wrap: anywhere; max-width: 44px; }
.yv-graph-node-id { position: absolute; top: calc(100% + 3px); left: 50%; transform: translateX(-50%); color: var(--yv-muted, #a8a8a8); font: 9px/1.2 var(--g-mono); white-space: nowrap; }
.yv-graph-node-meta { position: absolute; top: calc(100% + 16px); left: 50%; transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; width: 110px; }
.yv-graph-chip {
  padding: 1px 5px; border-radius: 5px; border: 1px solid color-mix(in srgb, var(--g-orange), transparent 60%);
  color: var(--g-orange); background: var(--yv-bg, #1a1a1a); font: 700 9px/1.3 var(--g-mono); white-space: nowrap;
}
.yv-graph-chip[data-meta-name="visited"][data-meta-value="true"] { border-color: var(--g-green); color: var(--g-green); }
.yv-graph-chip[data-meta-name="visited"][data-meta-value="false"] { color: var(--yv-muted, #a8a8a8); border-color: var(--yv-border, #3e3e3e); }
.yv-graph-chip[data-meta-name="color"][data-meta-value="red"] { border-color: var(--g-red); color: var(--g-red); }
.yv-graph-chip[data-meta-name="color"][data-meta-value="black"] { border-color: var(--yv-text, #efefef); color: var(--yv-text, #efefef); background: #0d0d0d; }
.yv-graph-chip-changed { color: #1a1a1a !important; background: var(--g-orange) !important; border-color: var(--g-orange) !important; animation: yv-g-chip 760ms ease-out both; }

.yv-graph-node-badges { position: absolute; left: 50%; bottom: calc(100% - 3px); z-index: 4; display: flex; gap: 3px; transform: translateX(-50%); pointer-events: none; white-space: nowrap; }
.yv-graph-node-badge {
  display: inline-flex; padding: 2px 7px; border-radius: 999px; color: #1a1a1a; background: var(--yv-muted, #a8a8a8);
  font: 800 9px/1.3 var(--g-mono); letter-spacing: .07em; animation: yv-g-badge 300ms cubic-bezier(.2, .9, .3, 1.3) both;
}
.yv-graph-node-badge.is-created { background: var(--g-green); }
.yv-graph-node-badge.is-changed { background: var(--g-orange); }
.yv-graph-node-badge.is-current { background: var(--g-blue); }
.yv-graph-node-badge.is-removed { background: var(--g-red); }
.yv-graph-node-flags { position: absolute; right: calc(100% + 6px); top: 50%; z-index: 4; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; transform: translateY(-50%); pointer-events: none; }
.yv-graph-node-flag { display: inline-flex; align-items: center; gap: 3px; padding: 1px 7px; border-radius: 6px; border: 1px solid var(--g-blue); color: var(--g-blue); background: var(--yv-bg, #1a1a1a); font: 700 11px/1.4 var(--g-mono); }
.yv-graph-node-flag::after { content: "\25B8"; font-size: 9px; }
.yv-graph-node-trail { position: absolute; right: -6px; bottom: -4px; z-index: 4; min-width: 18px; height: 18px; padding: 0 4px; box-sizing: border-box; border-radius: 9px; background: var(--g-blue); color: #06233f; font: 800 10px/18px var(--g-mono); text-align: center; }

/* ---------- vertex states: static cue first, animation on top ---------- */
.yv-graph-node.yv-graph-node-pointed { border-color: var(--g-blue); box-shadow: 0 0 0 3px color-mix(in srgb, var(--g-blue), transparent 78%); }
.yv-graph-node.yv-graph-node-created { border-color: var(--g-green); background: color-mix(in srgb, var(--g-green) 14%, var(--yv-bg, #1a1a1a)); animation: yv-g-node-insert 560ms cubic-bezier(.18, .82, .25, 1.18) both; }
.yv-graph-node.yv-graph-node-value-changed { border-color: var(--g-orange); box-shadow: 0 0 0 4px color-mix(in srgb, var(--g-orange), transparent 70%); animation: yv-g-node-value 720ms ease-out both; }
.yv-graph-node.yv-graph-node-changed:not(.yv-graph-node-value-changed):not(.yv-graph-node-created) { border-color: var(--g-amber); box-shadow: 0 0 0 3px color-mix(in srgb, var(--g-amber), transparent 76%); animation: yv-g-node-update 640ms ease-out both; }
.yv-graph-node.yv-graph-node-entered { border-color: var(--g-blue); box-shadow: 0 0 0 4px color-mix(in srgb, var(--g-blue), transparent 72%); animation: yv-g-node-visit 640ms ease-out both; }
.yv-graph-node.yv-graph-node-entered::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 2px solid var(--g-blue); opacity: 0; pointer-events: none; animation: yv-g-ripple 760ms ease-out both; }
.yv-graph-node.yv-graph-node-entered .yv-graph-node-flag { animation: yv-g-flag 420ms cubic-bezier(.2, .9, .3, 1.2) both; }
.yv-graph-node.yv-graph-node-removed { border-color: var(--g-red); border-style: dashed; background: transparent; color: var(--g-red); box-shadow: none; opacity: .55; animation: yv-g-node-gone 900ms ease-out both; }

/* ---------- keyframes ---------- */
@keyframes yv-g-edge-draw { to { stroke-dashoffset: 0; } }
@keyframes yv-g-edge-travel { 0% { stroke-dasharray: .2 .8; stroke-dashoffset: .2; } 100% { stroke-dasharray: 1 0; stroke-dashoffset: 0; } }
@keyframes yv-g-edge-fade { 0% { opacity: 1; stroke-width: 3.2; } 100% { opacity: .6; stroke-width: 2; } }
@keyframes yv-g-node-insert { 0% { opacity: 0; transform: scale(.2); } 60% { opacity: 1; transform: scale(1.14); } 100% { opacity: 1; transform: none; } }
@keyframes yv-g-node-value { 0% { transform: scale(1); } 22% { transform: scale(1.16); } 100% { transform: scale(1); } }
@keyframes yv-g-node-update { 0% { background: color-mix(in srgb, var(--g-amber) 32%, var(--yv-bg, #1a1a1a)); } 100% { background: color-mix(in srgb, var(--g-orange) 10%, var(--yv-bg, #1a1a1a)); } }
@keyframes yv-g-node-visit { 0% { transform: scale(.94); } 40% { transform: scale(1.12); } 100% { transform: scale(1); } }
@keyframes yv-g-ripple { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(1.7); } }
@keyframes yv-g-flag { 0% { opacity: 0; transform: translateX(-14px); } 100% { opacity: 1; transform: none; } }
@keyframes yv-g-node-gone { 0% { opacity: 1; transform: scale(1.1); } 100% { opacity: .55; transform: scale(1); } }
@keyframes yv-g-badge { 0% { opacity: 0; transform: translateY(6px) scale(.7); } 100% { opacity: 1; transform: none; } }
@keyframes yv-g-chip { 0% { transform: scale(1.35); } 100% { transform: scale(1); } }

/* ---------- reduced motion: keep colour cues, drop movement ---------- */
@media (prefers-reduced-motion: reduce) {
  .yv-graph-node.yv-graph-node-created, .yv-graph-node.yv-graph-node-value-changed,
  .yv-graph-node.yv-graph-node-changed, .yv-graph-node.yv-graph-node-entered,
  .yv-graph-node.yv-graph-node-entered::after, .yv-graph-node.yv-graph-node-entered .yv-graph-node-flag,
  .yv-graph-node.yv-graph-node-removed, .yv-graph-node-badge, .yv-graph-chip-changed,
  .yv-graph-edge.yv-graph-edge-traversed, .yv-graph-edge.yv-graph-edge-removed { animation: none; }
  .yv-graph-edge.yv-graph-edge-added { animation: none; stroke-dashoffset: 0; }
  .yv-graph-node, .yv-graph-edge { transition: none; }
}

</style>
</head>
<body>
<header><div><h1>Graph states</h1><p>Every graph state the renderer shows, using the real class names. Press Replay to watch an animation again. Reduced motion keeps the static colour cues.</p></div><button id="all">Replay all</button></header>
<main id="grid"></main>
<script>
const P={a:[60,48],b:[150,48],c:[240,48],d:[105,122],e:[195,122]};
const N=(id,v,x={})=>({id,v,...x});
const Ed=(f,t,s='steady',o=0)=>({f,t,s,o});
const base=()=>[N('a',1),N('b',2),N('c',3),N('d',4)];
const be=()=>[Ed('a','b'),Ed('a','d'),Ed('b','c'),Ed('d','c')];
const S=[
{t:'IDLE',n:'No supported delta. Nothing animates. Hover a vertex to isolate its links.',nodes:base(),edges:be()},
{t:'POINTED (STEADY)',n:'A variable points here. Static blue ring and a pointer flag.',nodes:[N('a',1,{flags:['cur'],cls:'yv-graph-node-pointed'}),...base().slice(1)],edges:be()},
{t:'VERTEX + EDGE CREATED',n:'New identity pops in, its incoming link draws itself with an ADDED label.',nodes:[...base(),N('e',5,{cls:'yv-graph-node-created',badges:[['is-created','NODE CREATED']]})],edges:[...be(),Ed('d','e','added')]},
{t:'VALUE UPDATE',n:'Same vertex, new label. Old to new in the badge, orange pulse.',nodes:[N('a',1),N('b',9,{cls:'yv-graph-node-value-changed yv-graph-node-changed',badges:[['is-changed','2 → 9']]}),N('c',3),N('d',4)],edges:be()},
{t:'LINK ADDED',n:'The adjacency list gained an entry. Green edge draws in, source is marked updated.',nodes:[N('a',1,{cls:'yv-graph-node-changed',badges:[['is-changed','NODE UPDATED']]}),...base().slice(1)],edges:[...be(),Ed('a','c','added')]},
{t:'VISIT + TRAVERSE',n:'A variable moved a to b along a real link. Ripple on the target, blue edge, flag drops in.',nodes:[N('a',1),N('b',2,{cls:'yv-graph-node-entered yv-graph-node-pointed',flags:['cur'],badges:[['is-current','VISITED']]}),N('c',3),N('d',4)],edges:[Ed('a','b','traversed'),Ed('a','d'),Ed('b','c'),Ed('d','c')]},
{t:'VISIT TRAIL',n:'Real visit order from the snapshots. Numbers and blue edges persist after the step.',nodes:[N('a',1,{trail:'1'}),N('b',2,{trail:'2'}),N('c',3,{trail:'3',flags:['cur'],cls:'yv-graph-node-pointed'}),N('d',4)],edges:[Ed('a','b','trail'),Ed('a','d'),Ed('b','c','trail'),Ed('d','c')]},
{t:'LINK REMOVED',n:'The entry is gone. The old link stays as a red dashed ghost for this step.',nodes:[N('a',1,{cls:'yv-graph-node-changed',badges:[['is-changed','NODE UPDATED']]}),...base().slice(1)],edges:[Ed('a','b'),Ed('b','c'),Ed('d','c'),Ed('a','d','removed')]},
{t:'VERTEX REMOVED',n:'The vertex is no longer captured. A dashed ghost fades at its old spot and its links show as removed.',nodes:base(),ghost:[N('e',5)],edges:[...be(),Ed('d','e','removed')]},
{t:'TWO-WAY, PARALLEL, SELF-LOOP',n:'Reverse and repeated links curve apart so every arrow stays visible. Self-loops arc above.',nodes:base(),edges:[Ed('a','b'),Ed('b','a'),Ed('b','c',"steady",0),Ed('b','c','steady',1),Ed('c','c'),Ed('a','d')]},
{t:'VERTEX METADATA',n:'Scalar fields like visited and dist show as chips. Only the changed chip flashes.',nodes:[N('a',1,{meta:[['visited',true],['dist',0]]}),N('b',2,{meta:[['visited',true,1],['dist',3,1]]}),N('c',3,{meta:[['visited',false],['dist','inf']]}),N('d',4,{meta:[['color','red']]})],edges:be()},
{t:'HOVER FOCUS',n:'Hover or focus a vertex: its links turn orange, everything else dims.',nodes:base().map(x=>x.id==='b'?{...x,cls:'is-hovered'}:x.id==='a'||x.id==='c'?{...x,cls:'is-neighbor'}:x),edges:be(),hover:'b'}
];
const R=27;
function geo(a,b,bend,loop){
 if(loop)return{d:`M ${a[0]-14} ${a[1]-23} C ${a[0]-44} ${a[1]-82}, ${a[0]+44} ${a[1]-82}, ${a[0]+14} ${a[1]-26}`,mx:a[0],my:a[1]-64};
 const dx=b[0]-a[0],dy=b[1]-a[1],l=Math.max(1,Math.hypot(dx,dy)),cx=(a[0]+b[0])/2+(-dy/l)*bend*2,cy=(a[1]+b[1])/2+(dx/l)*bend*2;
 const sx=cx-a[0],sy=cy-a[1],sl=Math.max(1,Math.hypot(sx,sy)),ex=cx-b[0],ey=cy-b[1],el=Math.max(1,Math.hypot(ex,ey));
 const x1=a[0]+sx/sl*R,y1=a[1]+sy/sl*R,x2=b[0]+ex/el*(R+4),y2=b[1]+ey/el*(R+4);
 return{d:`M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}`,mx:.25*x1+.5*cx+.25*x2,my:.25*y1+.5*cy+.25*y2};
}
function render(s){
 const all=[...s.nodes,...(s.ghost||[])];
 const dir=new Set(s.edges.map(e=>e.f+'>'+e.t));
 const g=e=>geo(P[e.f],P[e.t],e.f===e.t?0:(dir.has(e.t+'>'+e.f)?15:0)+e.o*17,e.f===e.t);
 const marks=['steady','added','removed','traversed','trail'].map(k=>`<marker id="yv-graph-arrow-${k}" class="yv-graph-arrow yv-graph-arrow-${k}" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z"/></marker>`).join('');
 const paths=s.edges.map(e=>`<path class="yv-graph-edge yv-graph-edge-${e.s}${s.hover&&(e.f===s.hover||e.t===s.hover)?' is-incident':''}" d="${g(e).d}" fill="none" pathLength="1" marker-end="url(#yv-graph-arrow-${e.s})"/>`).join('');
 const eb=s.edges.filter(e=>['added','removed','traversed'].includes(e.s)).map(e=>{const q=g(e);return`<span class="yv-graph-edge-badge yv-tree-operation-badge is-${e.s}" style="left:${q.mx}px;top:${q.my}px">${e.s.toUpperCase()}</span>`}).join('');
 const gh=(s.ghost||[]).map(n=>`<div class="yv-graph-node yv-graph-node-removed" style="left:${P[n.id][0]-R}px;top:${P[n.id][1]-R}px"><span class="yv-graph-node-badges"><span class="yv-graph-node-badge is-removed yv-tree-operation-badge">NODE REMOVED</span></span><span class="yv-graph-node-value">${n.v}</span><span class="yv-graph-node-id">${n.id}</span></div>`).join('');
 const nd=s.nodes.map(n=>`<div class="yv-graph-node ${n.cls||''}" tabindex="0" style="left:${P[n.id][0]-R}px;top:${P[n.id][1]-R}px">${n.badges?`<span class="yv-graph-node-badges">${n.badges.map(b=>`<span class="yv-graph-node-badge ${b[0]} yv-tree-operation-badge">${b[1]}</span>`).join('')}</span>`:''}${n.flags?`<span class="yv-graph-node-flags">${n.flags.map(f=>`<span class="yv-graph-node-flag">${f}</span>`).join('')}</span>`:''}<span class="yv-graph-node-value">${n.v}</span>${n.trail?`<span class="yv-graph-node-trail">${n.trail}</span>`:''}<span class="yv-graph-node-id">${n.id}</span>${n.meta?`<span class="yv-graph-node-meta">${n.meta.map(m=>`<span class="yv-graph-chip${m[2]?' yv-graph-chip-changed':''}" data-meta-name="${m[0]}" data-meta-value="${m[1]}">${m[0]}=${m[1]}</span>`).join('')}</span>`:''}</div>`).join('');
 return`<div class="yv-graph${s.hover?' is-hovering':''}"><div class="yv-graph-canvas"><svg class="yv-graph-links" width="300" height="170" viewBox="0 0 300 170"><defs>${marks}</defs>${paths}</svg>${eb}${gh}${nd}</div></div>`;
}
const grid=document.getElementById('grid');
S.forEach((s,i)=>{const c=document.createElement('section');c.className='cell';c.innerHTML=`<h2><span>${s.t}</span><button class="ghost" data-i="${i}">Replay</button></h2><div class="stage"></div><p>${s.n}</p>`;grid.appendChild(c);});
const play=i=>{grid.children[i].querySelector('.stage').innerHTML=render(S[i]);};
const all=()=>S.forEach((_,i)=>play(i));
grid.addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(b)play(+b.dataset.i);});
document.getElementById('all').onclick=all;all();
</script>
</body>
</html>
