# HEALTH-ONLY FALLBACK ONLY: arbitrary-code execution remains disabled on Render until a separately verified sandbox worker is integrated.
services:
  - type: web
    name: yourvision-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: MAX_CONCURRENT_EXECUTIONS
        value: 2
      - key: JSON_BODY_LIMIT
        value: 256kb
