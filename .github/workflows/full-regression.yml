name: Full Regression Lab

on:
  push:
    branches:
      - main
      - yourvision-safety-hardened
      - automation/comprehensive-regression-lab
      - feat/all-remaining-ds-visualization
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend feature matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Validate Vercel Sandbox proof script
        run: node --check vercel-sandbox-prototype/smoke.mjs

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run complete backend regression matrix
        working-directory: backend
        run: npm test

  extension:
    name: Extension feature matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install extension dependencies
        working-directory: extension
        run: npm ci

      - name: Run extension tests
        working-directory: extension
        run: npm test

      - name: Typecheck extension
        working-directory: extension
        run: npm run typecheck

      - name: Build extension
        working-directory: extension
        run: npm run build

      - name: Verify production extension configuration
        working-directory: extension
        env:
          VITE_YOURVISION_API_URL: https://yourvision-backend.onrender.com
          YOURVISION_PRODUCTION_BUILD: "true"
        run: |
          npm run build
          node --input-type=module -e "import fs from 'node:fs'; const m=JSON.parse(fs.readFileSync('dist/manifest.json','utf8')); if (!m.host_permissions.includes('https://yourvision-backend.onrender.com/*')) throw new Error('production API permission missing'); if (m.host_permissions.some(p => p.startsWith('http://127.0.0.1:'))) throw new Error('localhost permission leaked into production manifest');"

  container-smoke:
    name: Container build and smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build backend container
        run: docker build -f backend/Dockerfile -t yourvision-backend:ci .

      - name: Build and verify prebuilt Java sandbox image
        run: |
          docker build -f vercel-sandbox-prototype/Dockerfile -t yourvision-java-sandbox:ci vercel-sandbox-prototype
          docker run --rm yourvision-java-sandbox:ci java --list-modules | grep -q '^jdk.jdi@'
          docker run --rm yourvision-java-sandbox:ci javac -version

      - name: Start backend container
        run: docker run -d --name yourvision-backend -p 10000:10000 -e NODE_ENV=production -e PORT=10000 -e HOST=0.0.0.0 yourvision-backend:ci

      - name: Verify health and readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:10000/health; then
              break
            fi
            sleep 2
          done
          ready=$(curl --silent http://127.0.0.1:10000/readyz)
          printf '%s\n' "$ready"
          printf '%s' "$ready" | grep -q '"available":false'
          status=$(curl --silent --show-error --output /tmp/visualize-response.json --write-out '%{http_code}' -X POST http://127.0.0.1:10000/visualize -H 'content-type: application/json' --data '{"language":"java","source":"class Solution { public int sum(int[] nums) { int total=0; for (int n : nums) total += n; return total; } }","testcase":{"method":"sum","arguments":["[1,2,3,4]"]}}')
          test "$status" = "503"
          grep -q 'EXECUTION_SANDBOX_UNAVAILABLE' /tmp/visualize-response.json

      - name: Benchmark local Java tracing and resource use
        run: |
          docker logs yourvision-backend
          docker rm -f yourvision-backend
          started=$(date +%s%N)
          docker run -d --name yourvision-benchmark -p 10000:10000 -e NODE_ENV=development -e PORT=10000 -e HOST=0.0.0.0 yourvision-backend:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:10000/health; then
              break
            fi
            sleep 2
          done
          ended=$(date +%s%N)
          echo "local_container_start_to_health_ms=$(((ended-started)/1000000))"
          curl --silent --show-error --output /dev/null --write-out 'warm_health_seconds=%{time_total}\n' http://127.0.0.1:10000/health
          curl --silent --show-error --output /dev/null --write-out 'warm_readiness_seconds=%{time_total}\n' http://127.0.0.1:10000/readyz
          printf '%s' '{"language":"java","source":"class Solution { public int sum(int[] nums) { int total=0; for (int n : nums) total += n; return total; } }","testcase":{"method":"sum","arguments":["[1,2,3,4]"]}}' > /tmp/yourvision-benchmark.json
          for attempt in 1 2; do
            curl --silent --show-error --output "/tmp/visualization-$attempt.json" --write-out "java_visualization_${attempt}_seconds=%{time_total}\n" -X POST http://127.0.0.1:10000/visualize -H 'content-type: application/json' --data-binary @/tmp/yourvision-benchmark.json
            node -e "const r=require(process.argv[1]); if (r.execution?.kind !== 'OK' || r.execution?.result !== '10') { console.error(r); process.exit(1); }" "/tmp/visualization-$attempt.json"
          done
          docker stats --no-stream --format 'container_memory={{.MemUsage}} cpu={{.CPUPerc}}' yourvision-benchmark

      - name: Print logs and clean up
        if: always()
        run: |
          docker logs yourvision-benchmark || true
          docker rm -f yourvision-benchmark || true
          docker logs yourvision-backend || true
          docker rm -f yourvision-backend || true
